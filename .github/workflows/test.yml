name: deterministic-checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:2026.10.1-community
        env:
          NEO4J_AUTH: neo4j/ci-fixture-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-fixture-password 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-fixture-password
      NEO4J_DATABASE: neo4j
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check app tests scripts experiments
      - run: python -m pytest -q --live-neo4j
      - run: python -m app.verify_examples
      - run: python -m app.semantic_eval
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m ruff check evaluation
